<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dashboard</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        #weekly-tasks input, #goal-btn {
            margin: 5px;
        }
    </style>
</head>
<body>
    
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Rian Atri for the WEB-115 course at Wake Tech</p>

    <script>
    document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.")
    </script>

    <noscript>Unfortunately, your web browser does not support JavaScript.</noscript>

     <div class="container">
    <div class="row">
        <!-- Dashboard Content -->
        <div class="col" id="weekly-tasks">
            <script defer src="js/task-manager.js"></script>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name">

                <label for="daily-goal">Daily Task Goal:</label>
                <input type="number" id="daily-goal">

                <label for="bonus-tasks">Weekly Bonus Tasks:</label>
                <input type="number" id="bonus-tasks">

                <button id="goal-btn">Submit</button>
            </form>

            <p id="goal-message"></p>
<div id="task-list"><h3>Weekly Task List</h3><p>Enter a task below to manage your goals.</p><form><label for="task-name">Enter task:</label><input type="text" id="task-name" name="task"><button type="submit" id="add-task">Add Task</button></form></div>
        </div>

        <div class="col" id="metric-converter">
            <h2>Imperial/Metric Converter</h2>
            <form id="converter-form">
                <label for="converter-value">Value:</label>
                <input type="number" id="converter-value" step="any" placeholder="Enter a number">

                <label for="conversion-type">Conversion Type:</label>
                <select id="conversion-type">
                    <option value="inch to centimeter">Inch to Centimeter</option>
                    <option value="foot to centimeter">Foot to Centimeter</option>
                    <option value="yard to meter">Yard to Meter</option>
                    <option value="mile to kilometer">Mile to Kilometer</option>
                    <option value="centimeter to inch">Centimeter to Inch</option>
                    <option value="centimeter to foot">Centimeter to Foot</option>
                    <option value="meter to yard">Meter to Yard</option>
                    <option value="kilometer to mile">Kilometer to Mile</option>
                </select>

                <button id="convert-btn" type="submit">Convert</button>
            </form>

            <div id="conversion-result"></div>

            <script defer src="js/metric-converter.js"></script>
        </div>

        <div class="col" id="magic-eight-ball">
            <script src="js/magic-eight-ball.js" defer></script>
            <link rel="stylesheet" href="css/magic-eight-ball.css">
            <h2 class="heading">Magic Eight Ball</h2>
            <form>
                <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
                <input id="question" name="question" size="80">
                <div id="magicEightBall">
                    <div id="circle"></div>
                    <img id="ball" src="img/magic-eight-ball.png"/>
                </div>
                <button id="reset" name="reset" type="reset">Ask another question</button>
            </form>
            <br>
        </div>
    </div>
</div>
</body>
</html>
